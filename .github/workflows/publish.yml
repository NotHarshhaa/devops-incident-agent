name: Publish Release

# Fires only on version tags (vX.Y.Z), which release-please creates when a
# release PR is merged. Builds the Docker image and pushes it to GHCR,
# tagged with the exact version, the major.minor, the major, and `latest`.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image (mock mode, no infra required)
        run: |
          docker run -d --name incident-agent-smoke \
            -e MOCK_MODE=true -p 8000:8000 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "Published image is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Published image did not become healthy in time"
          docker logs incident-agent-smoke
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker logs incident-agent-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f incident-agent-smoke || true
