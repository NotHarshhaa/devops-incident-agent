name: Docker Build

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [master]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: devops-incident-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container (mock mode, no infra required)
        run: |
          docker run -d --name incident-agent-smoke \
            -e MOCK_MODE=true -p 8000:8000 devops-incident-agent:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "Service is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker logs incident-agent-smoke
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker logs incident-agent-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f incident-agent-smoke || true

  compose-config:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q
